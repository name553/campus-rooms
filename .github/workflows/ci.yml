name: Tests and application artifact

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Package application after successful tests
        run: git archive --format=zip --output=classroom-booking.zip HEAD

      - name: Upload application artifact
        uses: actions/upload-artifact@v7
        with:
          name: classroom-booking
          path: classroom-booking.zip
          if-no-files-found: error
          retention-days: 14
